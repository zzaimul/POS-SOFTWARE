<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a44">
<title>Owner Dashboard</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2333;--mute:#6b7585;--line:#e3e8f0;--navy:#1f2a44;--green:#1e8449;--red:#c0392b;--amber:#b9770e;--bar:#3b5bdb;--warnbg:#fff3dc;--critbg:#fbe3e1}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2232;--ink:#e8ecf4;--mute:#97a3b8;--line:#2a3550;--navy:#0c111b;--green:#43b581;--red:#ef6b5e;--amber:#e0a43b;--bar:#6c8cff;--warnbg:#3a2e14;--critbg:#3d1d1a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header small{display:block;color:#b8c4de;font-size:12px}
button{font:inherit;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.ghost{background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:720px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.delta{font-size:13px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}.mute{color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--bg);border-radius:10px;padding:8px 10px}
.tile b{display:block;font-size:18px}.tile span{font-size:11px;color:var(--mute)}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0;overflow:hidden;text-overflow:ellipsis}
.meter{height:8px;border-radius:5px;background:var(--bg);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--bar);border-radius:5px}
.chart{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart i{width:100%;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}
.chart i.z{background:var(--line)}
.axis{display:flex;gap:3px;font-size:10px;color:var(--mute)}
.axis span{flex:1;text-align:center;overflow:hidden}
.alert{padding:9px 10px;border-radius:9px;margin-top:8px;background:var(--warnbg);font-size:14px}
.alert.critical{background:var(--critbg)}
.alert small{display:block;color:var(--mute);font-size:12px}
.status{border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.status.ok{background:var(--card);border:1px solid var(--line);color:var(--mute)}
.status.stale{background:var(--warnbg);color:var(--amber);border:1px solid var(--amber)}
.status.err{background:var(--critbg);color:var(--red);border:1px solid var(--red)}
#login{max-width:380px;margin:12vh auto 0;padding:0 16px}
#login input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 12px}
#login .btn{width:100%}
#err{color:var(--red);min-height:20px;font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ===== SET THESE TWO VALUES ONCE (Supabase -> Project Settings -> API). The anon key is meant to be public;
     your data is protected by the sign-in and by the rules in supabase_setup.sql. ===== -->
<script>
const SUPABASE_URL = "https://qfvudwfcasuwfxujypoh.supabase.co";
const ANON_KEY     = "sb_publishable_z4okZZXzZ7n1zxcs7U5slA_4O4Z3Gxr";
</script>

<div id="login" class="hidden">
  <h1 style="margin:0 0 4px">Owner Dashboard</h1>
  <p class="mute" style="margin:0 0 18px">Sign in with the owner account.</p>
  <label>E-mail<input id="em" type="email" autocomplete="username" inputmode="email"></label>
  <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
  <div id="err"></div>
  <button class="btn" id="go">Sign in</button>
</div>

<div id="app" class="hidden">
  <header>
    <div><h1 id="title">Restaurant</h1><small id="sub"></small></div>
    <button class="ghost" id="out">Sign out</button>
  </header>
  <main>
    <div id="status" class="status ok">Loading...</div>
    <div id="content"></div>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = "owner_dash_session";
let session = null, cur = "", timer = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => cur + " " + Number(n || 0).toLocaleString("en-US", {maximumFractionDigits: 2});

// ---------- sign-in ----------
function saveSession(r){
  session = {access: r.access_token, refresh: r.refresh_token, exp: Date.now() + (r.expires_in || 3600) * 1000};
  try { localStorage.setItem(KEY, JSON.stringify(session)); } catch(e) {}
}
async function auth(body, grant){
  const r = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grant, {
    method: "POST", headers: {"apikey": ANON_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || "Sign-in failed");
  saveSession(j);
}
async function token(){
  if (!session) throw new Error("signed out");
  if (Date.now() > session.exp - 60000) await auth({refresh_token: session.refresh}, "refresh_token");
  return session.access;
}
function signOut(){
  session = null; try { localStorage.removeItem(KEY); } catch(e) {}
  clearInterval(timer); $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("pw").value = "";
}
$("go").onclick = async () => {
  $("err").textContent = "";
  try { await auth({email: $("em").value.trim(), password: $("pw").value}, "password"); start(); }
  catch(e){ $("err").textContent = e.message; }
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
$("out").onclick = signOut;

// ---------- data ----------
async function load(){
  const st = $("status");
  try {
    const t = await token();
    const r = await fetch(SUPABASE_URL + "/rest/v1/snapshot?id=eq.1&select=updated_at,data",
      {headers: {"apikey": ANON_KEY, "Authorization": "Bearer " + t}});
    if (r.status === 401) { signOut(); return; }
    if (!r.ok) throw new Error("Server answered " + r.status);
    const rows = await r.json();
    if (!rows.length) { st.className = "status stale"; st.textContent = "No data yet. Open the POS and use Owner Dashboard > Save and test connection."; return; }
    render(rows[0].data, new Date(rows[0].updated_at));
  } catch(e){
    if (e.message === "signed out") return signOut();
    st.className = "status err"; st.textContent = "Could not load: " + e.message + " (will retry)";
  }
}
function ago(d){
  const m = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.floor(m / 60) + " h " + (m % 60) + " min ago" : Math.floor(m / 1440) + " days ago";
}

function render(d, upd){
  cur = d.currency || "";
  $("title").textContent = d.name || "Restaurant";
  $("sub").textContent = d.today || "";
  document.title = (d.name || "Owner") + " - Dashboard";
  const mins = (Date.now() - upd.getTime()) / 60000, st = $("status");
  if (mins > 8) { st.className = "status stale"; st.textContent = "POS has not reported for " + ago(upd).replace(" ago","") + ". The POS may be off or offline. Showing the last known figures."; }
  else { st.className = "status ok"; st.textContent = "Updated " + ago(upd); }

  const s = d.sales || {}, y = s.yesterday || 0;
  let delta = "";
  if (y > 0) { const p = ((s.total - y) / y) * 100; delta = `<div class="delta ${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(0)}% vs yesterday (${esc(money(y))})</div>`; }
  else delta = `<div class="delta mute">Yesterday: ${esc(money(y))}</div>`;
  let h = `<div class="card"><h2>Today's sales</h2><div class="big">${esc(money(s.total))}</div>${delta}
    <div class="tiles"><div class="tile"><b>${s.orders || 0}</b><span>Orders</span></div>
    <div class="tile"><b>${esc(money(s.avg))}</b><span>Average bill</span></div>
    <div class="tile"><b>${s.items || 0}</b><span>Items sold</span></div></div>
    ${s.discount ? `<div class="mute" style="margin-top:10px;font-size:13px">Discounts given today: ${esc(money(s.discount))}</div>` : ""}</div>`;

  // alerts first - they are what an owner wants to notice
  const al = d.alerts || [];
  h += `<div class="card"><h2>Alerts (last 36 hours)</h2>` + (al.length ? al.map(a =>
    `<div class="alert ${esc(a.level)}"><b>${esc(a.event)}</b>${a.order ? " - order " + esc(a.order) : ""}
     <small>${esc(a.ts)} - ${esc(a.user)}${a.detail ? " - " + esc(a.detail) : ""}</small></div>`).join("") : `<div class="mute">Nothing unusual.</div>`) + `</div>`;

  const tl = d.till;
  h += `<div class="card"><h2>Till</h2>` + (tl ? `
    <div class="row"><span>Opened</span><b>${esc(tl.opened_at)} by ${esc(tl.opened_by)}</b></div>
    <div class="row"><span>Opening cash</span><b>${esc(money(tl.opening))}</b></div>
    <div class="row"><span>Cash sales</span><b>${esc(money(tl.cash_sales))}</b></div>
    <div class="row"><span>Cash in / out</span><b>${esc(money(tl.cash_in))} / ${esc(money(tl.cash_out))}</b></div>
    <div class="row"><span>Cash that should be in the drawer</span><b>${esc(money(tl.expected))}</b></div>` : `<div class="mute">The till is closed.</div>`) + `</div>`;

  const op = d.open || [];
  h += `<div class="card"><h2>Open orders (${op.length})</h2>` + (op.length ? op.map(o =>
    `<div class="row"><span class="l">${esc(o.label)} <span class="mute">- ${o.mins} min</span></span><b>${esc(money(o.total))}</b></div>`).join("") : `<div class="mute">No running orders.</div>`) + `</div>`;

  const meth = d.methods || [], mt = meth.reduce((a, m) => a + m.total, 0) || 1;
  h += `<div class="card"><h2>Payments</h2>` + (meth.length ? meth.map(m =>
    `<div style="margin-top:8px"><div class="row" style="border:0;padding:0"><span>${esc(m.k)} <span class="mute">(${m.n})</span></span><b>${esc(money(m.total))}</b></div>
     <div class="meter"><i style="width:${Math.round(m.total / mt * 100)}%"></i></div></div>`).join("") : `<div class="mute">No sales yet.</div>`) + `</div>`;

  const ty = d.types || [];
  if (ty.length) h += `<div class="card"><h2>Order types</h2>` + ty.map(t => `<div class="row"><span>${esc(t.k)} <span class="mute">(${t.n})</span></span><b>${esc(money(t.total))}</b></div>`).join("") + `</div>`;

  // hourly chart: from first sale hour to last (at least a few hours)
  const hrs = d.hours || [], nz = hrs.map((v, i) => v > 0 ? i : -1).filter(i => i >= 0);
  if (nz.length) {
    const a = Math.max(0, Math.min(...nz) - 1), b = Math.min(23, Math.max(...nz) + 1), mx = Math.max(...hrs.slice(a, b + 1));
    let bars = "", ax = "";
    for (let i = a; i <= b; i++) { bars += `<div><i class="${hrs[i] ? "" : "z"}" style="height:${hrs[i] ? Math.max(4, hrs[i] / mx * 100) : 2}%" title="${esc(money(hrs[i]))}"></i></div>`; ax += `<span>${i}</span>`; }
    h += `<div class="card"><h2>Sales by hour</h2><div class="chart">${bars}</div><div class="axis">${ax}</div></div>`;
  }

  const wk = d.week || [], wmx = Math.max(1, ...wk.map(x => x.total));
  if (wk.length) {
    h += `<div class="card"><h2>Last 7 days</h2><div class="chart">` + wk.map(x =>
      `<div><i class="${x.total ? "" : "z"}" style="height:${x.total ? Math.max(4, x.total / wmx * 100) : 2}%" title="${esc(money(x.total))}"></i></div>`).join("") +
      `</div><div class="axis">` + wk.map(x => `<span>${esc(x.d.slice(8))}</span>`).join("") + `</div>
      <div class="mute" style="font-size:13px;margin-top:8px">Total: ${esc(money(wk.reduce((a, x) => a + x.total, 0)))}</div></div>`;
  }

  const top = d.top || [];
  if (top.length) h += `<div class="card"><h2>Top items today</h2>` + top.map(i =>
    `<div class="row"><span class="l">${esc(i.name)}</span><b>${i.qty} <span class="mute" style="font-weight:400">/ ${esc(money(i.amount))}</span></b></div>`).join("") + `</div>`;

  $("content").innerHTML = h;
}

// ---------- start ----------
function start(){
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  load(); clearInterval(timer); timer = setInterval(load, 20000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && session) load(); });
(function init(){
  if (SUPABASE_URL.indexOf("YOUR-PROJECT") >= 0) { $("login").classList.remove("hidden"); $("err").textContent = "Set SUPABASE_URL and ANON_KEY at the top of this file first."; return; }
  try { session = JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e) { session = null; }
  if (session && session.refresh) start(); else $("login").classList.remove("hidden");
})();
</script>
</body>
</html>
